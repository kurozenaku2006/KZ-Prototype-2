<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KUROZENAKU Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Inter',sans-serif;
background:
radial-gradient(circle at top,#0f172a 0%,#020617 50%,#000000 100%);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.logo-font{
font-family:'Orbitron',sans-serif;
letter-spacing:.12em;
}

.glass{
background:rgba(255,255,255,.05);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
}

@keyframes pulseGlow{

0%{
box-shadow:0 0 10px rgba(20,184,166,.4);
}

50%{
box-shadow:0 0 35px rgba(20,184,166,1);
}

100%{
box-shadow:0 0 10px rgba(20,184,166,.4);
}

}

.glow-button{
animation:pulseGlow 2s infinite ease-in-out;
}

.glow-button:hover{
filter:brightness(1.1);
}

input,
textarea{

background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
outline:none;

}

</style>

</head>

<body>

<div
class="glass rounded-3xl p-8 w-full max-w-lg">

<div class="text-center">

<h1
class="logo-font text-4xl font-black bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">

KUROZENAKU

</h1>

<p class="text-gray-400 mt-3">

Login to continue

</p>

</div>

<!-- LOGIN SECTION -->

<div
id="loginSection"
class="mt-8">

<button
id="googleLoginBtn"
class="glow-button w-full bg-gradient-to-r from-cyan-500 to-emerald-500 py-4 rounded-2xl font-black text-lg">

Continue With Google

</button>

</div>

<!-- PROFILE SETUP -->

<div
id="profileSection"
class="hidden mt-8">

<h2 class="text-2xl font-bold mb-5">

Complete Your Profile

</h2>

<div class="space-y-4">

<input
id="customerName"
type="text"
placeholder="Full Name"
class="w-full rounded-2xl p-4">

<input
id="customerPhone"
type="tel"
placeholder="Phone Number"
class="w-full rounded-2xl p-4">

<textarea
id="customerAddress"
placeholder="Full Address"
class="w-full rounded-2xl p-4 min-h-[120px] resize-none"></textarea>

<button
id="saveProfileBtn"
class="glow-button w-full bg-gradient-to-r from-cyan-500 to-emerald-500 py-4 rounded-2xl font-black">

SAVE & CONTINUE

</button>

</div>

</div>

<!-- LOADING -->

<div
id="loadingSection"
class="hidden text-center mt-8">

<p class="text-cyan-300">

Loading...

</p>

</div>

</div>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script src="firebase-config.js"></script>

<script src="auth.js"></script>

</body>
</html>
