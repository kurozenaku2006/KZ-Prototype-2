<script>

function app(){

  return {

    menuOpen:false,
    filterOpen:false,

    search:'',
    category:'ALL',

    minPrice:'',

maxPrice:'',

sortBy:'default',

    products:[],

    pending:{},

    claimModal:false,

   trackingModal:false,

trackingId:'',

trackingResult:null,

historyModal:false,

historyContact:'',

historyOrders:[],
    
    wishlist:[],
wishlistModal:false,

recentlyViewed:[],
recentModal:false,

    selectedProduct:null,

    claimLoading:false,

    adminLoginOpen:false,

    adminPasscode:'',

    claimForm:{
  name:'',
  contact:'',
  address:'',
  note:''
},
    
isLoggedIn(){

  return localStorage.getItem(
    "kzUserId"
  );

},
    
   init(){

  const action =
  localStorage.getItem(
    "redirectAfterLogin"
  );

  if(action){

    localStorage.removeItem(
      "redirectAfterLogin"
    );

    if(action === "wishlist"){
      this.wishlistModal = true;
    }

    if(action === "recent"){
      this.recentModal = true;
    }

    if(action === "tracking"){
      this.trackingModal = true;
    }

    if(action === "history"){
      this.historyModal = true;
    }
if(action === "claim"){

  const product =
  localStorage.getItem(
    "selectedProduct"
  );

  if(product){

    this.selectedProduct =
    JSON.parse(product);

    this.claimModal = true;

    localStorage.removeItem(
      "selectedProduct"
    );

  }

}
  }

  const firebaseConfig = {

    apiKey:'AIzaSyByLURDPjEbLepc3Wz3O1MAYYLXSeu04Zg',

    authDomain:'kurozenaku-gundam-store.firebaseapp.com',

    projectId:'kurozenaku-gundam-store'

  };
      if(!firebase.apps.length){

        firebase.initializeApp(firebaseConfig);

      }

      const db = firebase.firestore();

      const savedWishlist =
localStorage.getItem('kzWishlist');

if(savedWishlist){

  this.wishlist =
  JSON.parse(savedWishlist);

}
const savedRecent =
localStorage.getItem('kzRecent');

if(savedRecent){

  this.recentlyViewed =
  JSON.parse(savedRecent);

}
     db.collection('products')
.onSnapshot(snapshot => {

  this.products =
  snapshot.docs
  .map(doc => ({
    id:doc.id,
    ...doc.data()
  }))
  .filter(product => !product.isDeleted);

});

    },

filteredProducts(){

  let items = this.products.filter(p => {

    const matchesSearch =
      (p.name || '')
      .toLowerCase()
      .includes(
        this.search.toLowerCase()
      );

    const matchesCategory =
      this.category === 'ALL'
      ||
      p.category === this.category;

    const matchesMin =
      !this.minPrice
      ||
      p.price >= Number(this.minPrice);

    const matchesMax =
      !this.maxPrice
      ||
      p.price <= Number(this.maxPrice);

    return (
      matchesSearch &&
      matchesCategory &&
      matchesMin &&
      matchesMax
    );

  });

  if(this.sortBy === 'low'){

   items.sort(
  (a,b) => Number(a.price) - Number(b.price)
);

  }

  if(this.sortBy === 'high'){

   items.sort(
  (a,b) => Number(b.price) - Number(a.price)
);

  }

  return items;

},
    toggleWishlist(product){

  if(!this.isLoggedIn()){

    localStorage.setItem(
      "redirectAfterLogin",
      "wishlist"
    );

    window.location.href =
    "auth.html";

    return;

  }

  const exists =
  this.wishlist.find(
    item => item.id === product.id
  );

  if(exists){

    this.wishlist =
    this.wishlist.filter(
      item => item.id !== product.id
    );

  }else{

    this.wishlist.push(product);

  }

  localStorage.setItem(
    "kzWishlist",
    JSON.stringify(this.wishlist)
  );

},

isWishlisted(product){

  return this.wishlist.some(
    item => item.id === product.id
  );

},

openWishlistPanel(){

  this.menuOpen = false;

  this.wishlistModal = true;

},

    requireLogin(action){

  if(!this.isLoggedIn()){

    localStorage.setItem(
      "redirectAfterLogin",
      action
    );

    window.location.href =
    "auth.html";

    return;

  }

  if(action==="wishlist"){
    this.openWishlistPanel();
  }

  if(action==="recent"){
    this.openRecentPanel();
  }

  if(action==="history"){
    this.openHistoryPanel();
  }

  if(action==="tracking"){
    this.openTrackingPanel();
  }

},
    openRecentPanel(){

  this.menuOpen = false;

  this.recentModal = true;

},

addToRecent(product){

  this.recentlyViewed =
  this.recentlyViewed.filter(
    item => item.id !== product.id
  );

  this.recentlyViewed.unshift(product);

  if(this.recentlyViewed.length > 10){

    this.recentlyViewed.pop();

  }

  localStorage.setItem(
    'kzRecent',
    JSON.stringify(this.recentlyViewed)
  );

},
  claimProduct(p){

  if(!this.isLoggedIn()){

    localStorage.setItem(
      "redirectAfterLogin",
      "claim"
    );

    localStorage.setItem(
      "selectedProduct",
      JSON.stringify(p)
    );

    window.location.href =
    "auth.html";

    return;

  }

  this.addToRecent(p);

  if(this.pending[p.id] || p.stock <= 0){
    return;
  }

  this.selectedProduct = p;

  this.claimModal = true;

},

    async submitClaim(){

if(
  !localStorage.getItem("kzUserId")
){
  alert("Please login first");
  return;
}

      const p = this.selectedProduct;

      this.claimLoading = true;

      this.pending[p.id] = true;

      try{

        const db = firebase.firestore();

const trackingId =
'KZ-' + Date.now();

await db.collection('claims').add({

  productId:p.id,
  productName:p.name,
  price:p.price,

  customerName:
localStorage.getItem("kzUserName"),

contact:
localStorage.getItem("kzUserPhone"),

address:
localStorage.getItem("kzUserAddress"),

  note:this.claimForm.note || '',

  trackingId:trackingId,

  status:'pending',

  createdAt:new Date(),
  updatedAt:new Date()

});

alert(
'Claim submitted successfully.\n\nTracking ID:\n' +
trackingId
);

this.claimModal = false;

this.claimLoading = false;

this.pending[p.id] = false;
      }

      catch(error){

        console.error(error);

        alert('Claim failed');

        this.claimLoading = false;

        this.pending[p.id] = false;

      }

    },

      this.menuOpen = false;

      alert('Customer claims panel coming next');

    openTrackingPanel(){

  this.menuOpen = false;

  this.trackingModal = true;

},
    openHistoryPanel(){

  this.menuOpen = false;

  this.historyModal = true;

},

    async trackOrder(){

      this.trackingResult = null;

  if(!this.trackingId){

    alert('Enter Tracking ID');

    return;

  }

  const db =
  firebase.firestore();

  const snapshot =
  await db
  .collection('claims')
  .where(
    'trackingId',
    '==',
    this.trackingId
  )
  .get();

  if(snapshot.empty){

    alert('Order not found');

    return;

  }

  this.trackingResult =
  snapshot.docs[0].data();

},

async loadOrderHistory(){

  this.historyOrders = [];

  if(!this.historyContact){

    alert('Enter Contact');

    return;

  }

  const db =
  firebase.firestore();

  let contact =
localStorage.getItem(
  "kzUserPhone"
);

const snapshot =
await db
.collection('claims')
.where(
  'contact',
  '==',
  contact
)
.get();

  if(snapshot.empty){

    alert('No orders found');

    return;

  }

  this.historyOrders =
  snapshot.docs.map(doc => doc.data());

},
